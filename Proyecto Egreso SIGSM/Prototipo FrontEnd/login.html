<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión - SIGSM</title>
  <!-- Bootstrap 5.3 (CSS)  -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons, para los iconitos -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Nuestros estilos propios (casi vacío) -->
  <link href="estilos.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container">
    <div class="row justify-content-center align-items-center" style="min-height: 100vh;">
      <div class="col-11 col-sm-8 col-md-5 col-lg-4">

        <div class="text-center mb-4">
          <i class="bi bi-hospital display-4 text-primary"></i>
          <h1 class="h4 mt-2 mb-0">SIGSM</h1>
          <p class="text-muted">Hospital de Clínicas</p>
        </div>

        <div class="card shadow-sm">
          <div class="card-body p-4">
            <h2 class="h5 mb-3">Iniciar sesión</h2>

            <form>
              <div class="mb-3">
                <label for="usuario" class="form-label">Usuario</label>
                <input type="text" class="form-control" id="usuario" placeholder="nombre.apellido">
              </div>

              <div class="mb-3">
                <label for="clave" class="form-label">Contraseña</label>
                <input type="password" class="form-control" id="clave" placeholder="••••••••">
              </div>

              <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" id="recordar">
                <label class="form-check-label" for="recordar">Recordarme</label>
              </div>

 
              <a href="admin-documentos.html" class="btn btn-primary w-100">Ingresar</a>
            </form>
          </div>
        </div>

      </div>
    </div>
  </div>

</body>
</html>

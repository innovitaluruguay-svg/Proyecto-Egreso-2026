<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuevo traslado - SIGSM</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/estilos.css rel="stylesheet">
</head>
<body class="bg-light">

  <!-- barra de navegacion -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html"><i class="bi bi-hospital"></i>SIGSM</a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="admin-documentos.html">Documentos</a></li>
          <li class="nav-item"><a class="nav-link" href="encuesta.html">Encuestas</a></li>
          <li class="nav-item"><a class="nav-link active" href="ambulancias.html">Ambulancias</a></li>
        </ul>
        <a href="login.html" class="btn btn-outline-light btn-sm">Cerrar sesión</a>
      </div>
    </div>
  </nav>

  <div class="container my-4" style="max-width: 720px;">

    <div class="d-flex align-items-center gap-2 mb-3">
      <a href="ambulancias.html" class="btn btn-sm btn-outline-secondary"><i class="bi bi-arrow-left"></i></a>
      <h1 class="h4 mb-0">Nuevo traslado</h1>
    </div>

    <div class="card">
      <div class="card-body">
        <form>

          <!-- que se traslada -->
          <fieldset class="mb-4">
            <legend class="h6">¿Qué se traslada?</legend>
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label">Tipo</label>
                <select class="form-select">
                  <option>Paciente</option>
                  <option>Equipamiento médico</option>
                  <option>Insumos</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label">Vehículo asignado</label>
                <select class="form-select">
                  <option>Ambulancia 01</option>
                  <option>Ambulancia 02</option>
                  <option>Auto 01</option>
                  <option>Auto 02</option>
                </select>
                <div class="form-text">No todos los traslados se pueden hacer en cualquier vehículo.</div>
              </div>
            </div>
          </fieldset>

          <!-- datos del paciente -->
          <fieldset class="mb-4">
            <legend class="h6">Datos del paciente</legend>
            <div class="row g-3 align-items-end">
              <div class="col-md-5">
                <label class="form-label">Cédula de identidad</label>
                <input type="text" class="form-control" placeholder="Ej: 4.123.456-7">
              </div>
              <div class="col-md-3">
                <!-- este boton consultara la API externa por C.I. -->
                <button type="button" class="btn btn-outline-primary w-100">Buscar</button>
              </div>
              <div class="col-md-4">
                <label class="form-label">Nombre (autocompletado)</label>
                <input type="text" class="form-control" value="Juan Pérez" disabled>
              </div>
            </div>
      <!-- Los datos del paciente se obtienen de una API externa a partir de la C.I.-->
          </fieldset>

          <!-- personal asignado -->
          <fieldset class="mb-4">
            <legend class="h6">Personal asignado</legend>
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label">Conductor</label>
                <select class="form-select">
                  <option>Marcos Silva</option>
                  <option>Ana Rodríguez</option>
                  <option>Pedro Gómez</option>
                  <option>Carlos Núñez</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label">Enfermero (responsable del paciente)</label>
                <select class="form-select">
                  <option>Lucía Bentancor</option>
                  <option>Rosa Díaz</option>
                  <option>No aplica</option>
                </select>
              </div>
            </div>
          </fieldset>

          <!-- recorrido -->
          <fieldset class="mb-4">
            <legend class="h6">Recorrido</legend>
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label">Origen</label>
                <select class="form-select">
                  <option>Hospital de Clínicas - Salida general</option>
                  <option>Policlínica Centro</option>
                  <option>Policlínica Periférica</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label">Destino</label>
                <input type="text" class="form-control" placeholder="Ej: Sanatorio Americano">
              </div>
              <div class="col-md-6">
                <label class="form-label">Hora de salida estimada</label>
                <input type="time" class="form-control">
              </div>
              <div class="col-md-6">
                <label class="form-label">Hora de llegada estimada</label>
                <input type="time" class="form-control">
              </div>
            </div>
          </fieldset>

          <div class="mb-3">
            <label class="form-label">Observaciones</label>
            <textarea class="form-control" rows="2" placeholder="Datos adicionales del traslado..."></textarea>
          </div>

          <a href="ambulancias.html" class="btn btn-primary w-100">Registrar traslado</a>
        </form>
      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

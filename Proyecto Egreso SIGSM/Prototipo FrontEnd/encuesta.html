<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Encuesta de satisfacción - SIGSM</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="assets/css/estilos.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container py-4" style="max-width: 600px;">

    <div class="mb-4">
      <span class="badge bg-success mb-2">Respuesta anónima</span>
      <h1 class="h4">Encuesta de satisfacción</h1>
      <p class="text-muted mb-0">Servicio: Ecocardiograma transesofágico - Cardiología</p>
    </div>

    <div class="card">
      <div class="card-body">
        <form>

          <div class="mb-4">
            <label class="form-label fw-bold">1. ¿Cómo calificás la claridad de la información recibida?</label>
            <div class="btn-group w-100" role="group">
              <input type="radio" class="btn-check" name="p1" id="p1-1">
              <label class="btn btn-outline-primary" for="p1-1">1</label>

              <input type="radio" class="btn-check" name="p1" id="p1-2">
              <label class="btn btn-outline-primary" for="p1-2">2</label>

              <input type="radio" class="btn-check" name="p1" id="p1-3" checked>
              <label class="btn btn-outline-primary" for="p1-3">3</label>

              <input type="radio" class="btn-check" name="p1" id="p1-4">
              <label class="btn btn-outline-primary" for="p1-4">4</label>

              <input type="radio" class="btn-check" name="p1" id="p1-5">
              <label class="btn btn-outline-primary" for="p1-5">5</label>
            </div>
            <div class="d-flex justify-content-between small text-muted mt-1">
              <span>Poco clara</span><span>Muy clara</span>
            </div>
          </div>


          <div class="mb-4">
            <label class="form-label fw-bold">2. ¿Accediste sin problemas mediante el código QR?</label>

            <div class="form-check">
              <input class="form-check-input" type="radio" name="p2" id="p2-1" checked>
              <label class="form-check-label" for="p2-1">Sí, sin dificultades</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="p2" id="p2-2">
              <label class="form-check-label" for="p2-2">Con alguna dificultad</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="p2" id="p2-3">
              <label class="form-check-label" for="p2-3">No pude acceder</label>
            </div>
          </div>

          <!-- ---- Pregunta 3: comentario libre ---- -->
          <div class="mb-4">
            <label class="form-label fw-bold">3. Comentarios (opcional)</label>
            <textarea class="form-control" rows="3" placeholder="Contanos qué podemos mejorar..."></textarea>
          </div>

          <button type="button" class="btn btn-primary w-100">Enviar respuestas</button>
        </form>
      </div>
    </div>

  </div>

</body>
</html>
